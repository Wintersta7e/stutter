# A Postgres whose entrypoint throws its cluster away whenever one is already there: every restore
# then runs a different cluster than the snapshot recorded.
name: identity

services:
  app:
    image: example.test/app:1
    environment:
      NATS_URL: nats://bus:4222
      DATABASE_URL: postgres://postgres@db3:5432/postgres
    depends_on:
      db3:
        condition: service_started

  bus:
    image: nats:2.14-alpine

  db3:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    entrypoint: ["sh", "-c", "if [ -f \"$$PGDATA/PG_VERSION\" ]; then rm -rf \"$$PGDATA\"; fi; exec docker-entrypoint.sh postgres"]
