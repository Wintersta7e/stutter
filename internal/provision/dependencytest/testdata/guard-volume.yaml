# A Postgres whose entrypoint puts its cluster back under the image's VOLUME whatever PGDATA says: a
# commit would keep none of it, so the snapshot must be refused.
name: guardvolume

services:
  app:
    image: example.test/app:1
    environment:
      NATS_URL: nats://bus:4222
      DATABASE_URL: postgres://postgres@db2:5432/postgres
    depends_on:
      fill:
        condition: service_completed_successfully
      db2:
        condition: service_started

  bus:
    image: nats:2.14-alpine

  db2:
    image: postgres:18-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    entrypoint: ["sh", "-c", "export PGDATA=/var/lib/postgresql/data; exec docker-entrypoint.sh postgres"]

  fill:
    image: postgres:18-alpine
    depends_on:
      db2:
        condition: service_started
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "db2", "-U", "postgres",
                 "-c", "CREATE TABLE filled (id int); INSERT INTO filled VALUES (1), (2)"]
