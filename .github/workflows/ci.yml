name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more say so themselves.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOVULNCHECK_VERSION: "v1.7.0"
  GITLEAKS_VERSION: "8.30.1"
  ACTIONLINT_VERSION: "v1.7.7"
  # Total statement coverage the suite must not fall below. Raise it when it is
  # comfortably exceeded; never lower it to make a red build green.
  COVERAGE_FLOOR: "65"

# Actions are pinned to commit SHAs, not tags: a tag can be moved to point at
# different code after review, a SHA cannot.
jobs:
  lint:
    name: Lint, format and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          # Never truncate: a capped report hides issues behind the ones it shows.
          args: --max-issues-per-linter=0 --max-same-issues=0
      - name: Formatting is clean
        run: golangci-lint fmt --diff
      - name: One build definition
        run: make buildscan
      - name: Functions unreachable from the CLI
        # The set must equal the committed baseline: a new name is a function nothing calls, and a
        # baseline name no longer reported was wired or deleted without the baseline following.
        run: make deadcode
      - name: Local-only proofs
        # Proofs tagged localproof run by hand on the engine they need and are recorded in the guard
        # ledger; CI never compiles them. It lists them, and fails if a production file hides there.
        run: make localproofs
      - name: No testcontainers
        # Its reaper would be a second remover of resources on the engine the tests share.
        run: make nocontainers
      - name: Workflows are valid
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          actionlint

  test:
    name: Test
    runs-on: ubuntu-latest
    # PROVISIONAL, to obtain a first complete run: 2 minutes (twice a local 54.0 s measurement) cancelled
    # the job mid-test on 2026-09-24, and the whole job took 2 min 46 s before the Docker suite existed.
    # Reset to twice the duration of the first green run on CI, with that run's id in this comment.
    timeout-minutes: 15
    # The replay suite drives the real Postgres wire protocol against a real
    # server. Without one it SKIPS and still prints "ok", which is a false green.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stutter
          POSTGRES_PASSWORD: stutter
          POSTGRES_DB: stutter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stutter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STUTTER_TEST_POSTGRES: postgres://stutter:stutter@127.0.0.1:5432/stutter?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: The engine this Docker suite runs against
        # The Docker tests fail without an engine, so this job is the Docker job. The compose version
        # is read from docker info's plugin list.
        run: |
          docker version
          docker info

      - name: Test with race detection
        # Uncached, and counted: a cached pass proves nothing about this commit, and a skipped test
        # prints the same "ok" as one that ran. The counter fails on any skip.
        run: |
          make tree-snapshot TREE="$RUNNER_TEMP/tree"
          make test
          make tree-check TREE="$RUNNER_TEMP/tree"

      - name: Coverage floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" \
            'BEGIN { if (t+0 < f+0) { print "::error::coverage " t "% is below the floor " f "%"; exit 1 } }'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  flake:
    name: Flake hunt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The unit suite runs repeatedly under shuffling. A test that passes once and
    # fails on the third shuffle is a test that will waste somebody's afternoon.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Repeat every package that needs neither a database nor Docker
        # The set is derived from the packages themselves, never listed by hand: a package whose tests
        # read the database variable, or whose test binary links the Docker helper, is left out.
        run: |
          set -euo pipefail
          go list -test -json ./... | go run ./tools/testgate flakeset > "$RUNNER_TEMP/flake-packages"
          mapfile -t pkgs < "$RUNNER_TEMP/flake-packages"
          go test -race -shuffle=on -count=5 -json "${pkgs[@]}" | go run ./tools/testgate count -docker=excluded

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./...

  smoke:
    name: Binary smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Building is not running. These assert the binary starts and that its exit
    # codes mean what the README says they mean.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build BIN=stutter
      - name: The artifact is static
        run: make static-check BIN=stutter
      - name: A shell CGO cannot make the build dynamic
        # CGO in the environment must not override the Makefile's plain default; only a CGO=1 on
        # make's own command line may, and nothing in CI passes one.
        run: CGO=1 make build BIN=stutter-env && make static-check BIN=stutter-env
      - name: A Docker test fails without an engine and skips only when opted out
        env:
          DOCKER_HOST: unix:///nonexistent.sock
        run: |
          # Actions runs this under `bash -e`; two of the probes below are meant to fail, so errexit is
          # off until their outputs are judged.
          set +e -uo pipefail
          dir="$RUNNER_TEMP/optout"; mkdir -p "$dir"
          probe() { go test -count=1 -json -run '^TestTheEngineAnswers$' ./internal/dockertest/; }
          (unset STUTTER_TEST_DOCKER; probe) > "$dir/unset.json"
          STUTTER_TEST_DOCKER=skip probe > "$dir/skip.json"
          STUTTER_TEST_DOCKER=bogus probe > "$dir/bogus.json"
          set -e
          go run ./tools/testgate expect -test TestTheEngineAnswers -action fail < "$dir/unset.json"
          go run ./tools/testgate expect -test TestTheEngineAnswers -action skip -reason 'STUTTER_TEST_DOCKER=skip:' < "$dir/skip.json"
          go run ./tools/testgate expect -test TestTheEngineAnswers -action fail < "$dir/bogus.json"
          if STUTTER_TEST_DOCKER=skip go run ./tools/testgate count < "$dir/skip.json" > "$dir/count.out"; then
            cat "$dir/count.out"; echo "::error::the counter accepted an opted-out Docker suite in CI"; exit 1
          fi
          cat "$dir/count.out"
          grep -q '^refused: STUTTER_TEST_DOCKER=skip' "$dir/count.out"
      - name: version and help succeed
        run: |
          ./stutter version
          ./stutter help > /dev/null
      - name: a missing database is a setup error, not a verdict
        run: |
          set +e
          ./stutter check > /dev/null 2>&1
          code=$?
          set -e
          [ "$code" -eq 3 ] || { echo "::error::expected exit 3, got $code"; exit 1; }
      - name: an unknown command does not exit clean
        run: |
          set +e
          ./stutter wibble > /dev/null 2>&1
          code=$?
          set -e
          [ "$code" -ne 0 ] || { echo "::error::unknown command exited 0"; exit 1; }

  security:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: Module checksums verify
        run: go mod verify
      - name: No known vulnerabilities
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...
      - name: No secrets, across the whole history
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact

  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Subjects follow Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -u
          empty=0000000000000000000000000000000000000000

          # A pull request checks its own commits. A push checks what it added —
          # falling back to the whole history when the previous tip is unknown,
          # which is the case on a new branch or after a force push.
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "$empty" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${HEAD_SHA}"
          else
            range="${HEAD_SHA}"
          fi

          echo "checking range: ${range}"

          # Written to a file rather than a variable: a subject may contain $ or a
          # backslash, and a heredoc would expand them before they were checked.
          git log --no-merges --format='%s' "${range}" > subjects.txt
          if [ ! -s subjects.txt ]; then
            echo "no commits in range; nothing to check"
            exit 0
          fi

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9/._-]+\))?!?: .+'
          status=0
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            if printf '%s' "$subject" | grep -qE "$pattern"; then
              printf '  ok    %s\n' "$subject"
            else
              echo "::error::not a conventional commit subject: ${subject}"
              status=1
            fi
            if [ "${#subject}" -gt 72 ]; then
              echo "::error::subject longer than 72 characters: ${subject}"
              status=1
            fi
          done < subjects.txt
          exit $status
