name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Formatting is clean
        run: golangci-lint fmt --diff

  test:
    name: Test
    runs-on: ubuntu-latest
    # The replay tests drive the real Postgres wire protocol against a real server. Without one they
    # skip, which would quietly reduce CI to unit tests only.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stutter
          POSTGRES_PASSWORD: stutter
          POSTGRES_DB: stutter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stutter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STUTTER_TEST_POSTGRES: postgres://stutter:stutter@127.0.0.1:5432/stutter?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  hygiene:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go.mod is tidy
        run: go mod tidy -diff
      - name: No known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...
