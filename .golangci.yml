# Strictest-available posture: every linter on by default, each exception justified inline.
# Adopted before the first line of code: retrofitting strict tooling costs more than living with it.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: all
  disable:
    # Requires every field of every struct literal to be set. Unusable against stdlib and
    # third-party structs, which is most literals in a proxy and container-orchestration codebase.
    - exhaustruct_v5
    # Opinionated minimum identifier length. Conflicts with idiomatic short receivers and loop vars.
    - varnamelen
    # Bans `if err := f(); err != nil`, which is the idiomatic Go form the stdlib itself uses.
    - noinlineerr
    # Blank-line-before-return is wsl_v5's remit; running both produces contradictory fixes.
    - nlreturn
    # Deprecated aliases superseded by the _v2/_v5 variants already enabled by `default: all`.
    - exhaustruct
    - gomodguard
    - wsl

  settings:
    cyclop:
      max-complexity: 12
    gocyclo:
      min-complexity: 12
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    nestif:
      min-complexity: 4
    dupl:
      threshold: 150
    lll:
      line-length: 120
    godox:
      # TODO/FIXME in committed code is exactly the tech debt this project refuses to start with.
      # Unfinished work belongs in an issue or a plan, never in a comment that ships.
      keywords: [TODO, FIXME, HACK, XXX, BUG, OPTIMIZE]
    ireturn:
      allow: [anon, error, empty, stdlib]
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      settings:
        shadow:
          # Non-strict reports the dangerous case: an outer variable read after being shadowed.
          # Strict additionally flags every `if err := f(); err != nil` inside a function that
          # already has an err, which is the idiomatic form the stdlib itself uses. Satisfying it
          # means err2, err3 — worse code in exchange for no defect caught.
          strict: false
    revive:
      enable-all-rules: true
      rules:
        - name: line-length-limit
          arguments: [120]
        - name: function-length
          arguments: [80, 50]
        - name: cognitive-complexity
          arguments: [20]
        - name: cyclomatic
          arguments: [12]
        # add-constant duplicates mnd; running both double-reports every literal.
        - name: add-constant
          disabled: true
        # Package comments are enforced by revive's package-comments rule already.
        - name: max-public-structs
          disabled: true
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
    depguard:
      rules:
        main:
          deny:
            - pkg: math/rand
              desc: >-
                Non-cryptographic. Pseudonymisation keys and HMAC material must come from
                crypto/rand.
            - pkg: github.com/pkg/errors
              desc: Superseded by stdlib errors wrapping; use fmt.Errorf with %w.
            - pkg: io/ioutil
              desc: Deprecated since Go 1.16; use io and os.
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: Report output goes through the reporter, not stdout. Allowed only under cmd/.
      analyze-types: true

  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Tests legitimately repeat themselves, use literals, and declare fixtures at package scope.
      - path: _test\.go
        linters:
          - cyclop
          - dupl
          - err113
          - funlen
          - gocognit
          - gocyclo
          - gochecknoglobals
          - maintidx
          - mnd
          # A test adapter's error goes straight to t.Fatalf, which prints it. There is no caller
          # further up to give context to, so wrapping only adds noise.
          - wrapcheck
      # A table-driven test's table is data, and a test's assertions are independent branches rather
      # than logic to simplify. Only the size rules are relaxed; every other revive rule still
      # applies to test code.
      - path: _test\.go
        linters:
          - revive
        text: (function-length|cyclomatic|cognitive-complexity)
      # The CLI is the one place stdout is the product.
      - path: ^cmd/
        linters:
          - forbidigo

formatters:
  enable:
    - gci
    - gofumpt
    - golines
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/Wintersta7e/stutter)
      custom-order: true
    gofumpt:
      extra:
        group-params: true
    golines:
      max-len: 120
